<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Better Google Calendar</title>
<style>
  body { margin: 0; width: 260px; font: 14px Roboto, 'Google Sans', Arial, sans-serif; color: #3c4043; background: #fff; }
  .head { display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px; }
  .head img { width: 24px; height: 24px; }
  .head b { font: 500 15px 'Google Sans', Roboto, Arial, sans-serif; color: #202124; }
  .menu { list-style: none; margin: 0; padding: 4px 0 8px; }
  .menu button { display: flex; align-items: center; gap: 14px; width: 100%; border: 0; background: transparent; text-align: left; padding: 10px 16px; font: inherit; color: #3c4043; cursor: pointer; }
  .menu button:hover, .menu button:focus-visible { background: #f1f3f4; outline: none; }
  .menu svg { width: 20px; height: 20px; fill: #5f6368; flex: none; }
  .about { display: none; padding: 4px 16px 14px; line-height: 20px; }
  .about.show { display: block; }
  .about .ver { color: #5f6368; font-size: 12px; }
  .about a { color: #1a73e8; text-decoration: none; display: block; margin-top: 4px; }
  .about #author { display: inline; margin: 0; }
  .about a:hover { text-decoration: underline; }
  .about .back { margin-top: 10px; border: 0; background: transparent; color: #1a73e8; font: 500 13px 'Google Sans', Roboto, Arial, sans-serif; cursor: pointer; padding: 0; }
  .hint { padding: 0 16px 12px; font-size: 12px; color: #70757a; line-height: 16px; }
</style>
</head>
<body>
