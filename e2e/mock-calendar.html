<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mock Google Calendar</title>
<style>
  body { margin: 0; font-family: Roboto, Arial, sans-serif; background: #fff; color: #3c4043; }
  header { height: 64px; border-bottom: 1px solid #dadce0; display: flex; align-items: center; padding: 0 16px; gap: 16px; font-size: 22px; }
  .shell { display: flex; height: calc(100vh - 64px); }
  aside { width: 256px; flex: none; border-right: 1px solid #dadce0; padding: 12px 8px; font-size: 14px; overflow: auto; }
  aside[hidden] { display: none; }
  aside .ghead { font-weight: 500; color: #3c4043; padding: 8px 8px 4px; }
  aside ul { list-style: none; margin: 0; padding: 0; }
  aside li { display: flex; align-items: center; gap: 8px; padding: 4px 8px; }
  #menu { border: 0; background: transparent; font-size: 22px; cursor: pointer; }
  main { display: grid; grid-template-columns: 56px repeat(7, 1fr); flex: 1; overflow: auto; position: relative; }
  .gutter div { height: 48px; font-size: 10px; color: #70757a; text-align: right; padding-right: 6px; }
  .col { border-right: 1px solid #dadce0; position: relative; height: 1152px; }
  .col .head { font-size: 12px; color: #70757a; padding: 4px 8px; }
  .chip { position: absolute; left: 4px; right: 4px; border-radius: 4px; color: #fff; font-size: 12px; padding: 2px 6px; cursor: pointer; }
</style>
</head>
<body>
<header><button id="menu" aria-label="Main menu">&#9776;</button>Mock Google Calendar (e2e)</header>
<div class="shell">
<aside role="complementary" id="sidebar">
  <div class="group">
    <div class="ghead" role="heading" aria-level="2">My calendars</div>
    <ul role="list">
      <li role="listitem"><input type="checkbox" id="cal-work" checked aria-label="Work"><label for="cal-work">Work</label></li>
      <li role="listitem"><input type="checkbox" id="cal-personal" checked aria-label="Personal"><label for="cal-personal">Personal</label></li>
    </ul>
  </div>
  <div class="group">
    <div class="ghead" role="heading" aria-level="2">Other calendars</div>
    <ul role="list">
      <li role="listitem"><input type="checkbox" id="cal-holidays" checked aria-label="Holidays in Spain"><label for="cal-holidays">Holidays in Spain</label></li>
      <li role="listitem"><input type="checkbox" id="cal-team" aria-label="Team"><label for="cal-team">Team</label></li>
    </ul>
  </div>
</aside>
<main role="main">
  <div class="gutter" id="gutter"></div>
</main>
</div>
<script>
  // Google Calendar has its own drag handlers; make sure ours win over them.
  window.__googleHandlerFired = 0;
  document.addEventListener('drop', () => { window.__googleHandlerFired++; });
  window.__chipClicks = [];
  document.addEventListener('click', (e) => { const c = e.target.closest('[data-eventid]'); if (c) window.__chipClicks.push(c.getAttribute('data-eventid')); });
  document.addEventListener('dragover', (e) => { e.dataTransfer.dropEffect = 'none'; });
  document.getElementById('menu').addEventListener('click', () => { const s = document.getElementById('sidebar'); s.hidden = !s.hidden; });

  // A week of day columns with Google's data-datekey encoding, an hour gutter
  // and two chips today (one already over, one later today).
  const gutter = document.getElementById('gutter');
  for (let h = 0; h < 24; h++) {
    const d = document.createElement('div');
    d.textContent = h === 0 ? '12 AM' : h < 12 ? `${h} AM` : h === 12 ? '12 PM' : `${h - 12} PM`;
    gutter.appendChild(d);
  }
  const today = new Date();
  const monday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - ((today.getDay() + 6) % 7));
  const main = document.querySelector('main');
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
    const col = document.createElement('div');
    col.className = 'col';
    col.setAttribute('role', 'gridcell');
    col.setAttribute('data-datekey', String(((d.getFullYear() - 1970) << 9) + ((d.getMonth() + 1) << 5) + d.getDate()));
    col.innerHTML = `<div class="head">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]} ${d.getDate()}</div>`;
    if (d.toDateString() === today.toDateString()) {
      const mk = (start, end, title, color, id, calendar) => {
        const c = document.createElement('div');
        c.className = 'chip';
        c.setAttribute('data-eventid', id);
        c.style.top = `${start * 48}px`;
        c.style.height = `${(end - start) * 48 - 2}px`;
        c.style.backgroundColor = color;
        const fmt = (h) => (h % 24 === 0 ? '12am' : h < 12 ? `${h}am` : h === 12 ? '12pm' : `${h - 12}pm`);
        c.innerHTML = `<span aria-hidden="true">${title}</span><span style="position:absolute;left:-9999px">${fmt(start)} to ${fmt(end)}, ${title}, ${calendar || 'Work'}</span>`;
        col.appendChild(c);
      };
      mk(1, 2, 'Early standup', 'rgb(3, 155, 229)', 'ev1');   // always in the past
      mk(23, 24, 'Late review', 'rgb(213, 0, 0)', 'ev2');     // always in the future
      // The same meeting on three calendars (Work, Team, and a "Busy" copy) and a lone lunch.
      mk(10, 11, 'Team sync', 'rgb(3, 155, 229)', 'ev3', 'Work');
      mk(10, 11, 'Team sync', 'rgb(51, 182, 121)', 'ev4', 'Team');
      mk(10, 11, 'Busy', 'rgb(142, 36, 170)', 'ev5', 'Personal');
      mk(12, 13, 'Lunch', 'rgb(230, 124, 115)', 'ev6', 'Personal');
    }
    main.appendChild(col);
  }
</script>
</body>
</html>
